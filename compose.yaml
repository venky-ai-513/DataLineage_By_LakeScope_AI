name: lakescope-local

services:
  postgres:
    build:
      context: .
      dockerfile: containers/postgres.Containerfile
    image: localhost/lakescope-postgres:17-hardened
    container_name: lakescope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LAKESCOPE_POSTGRES_DB:-lakescope}
      POSTGRES_USER: ${LAKESCOPE_POSTGRES_USER:-lakescope}
      POSTGRES_PASSWORD: ${LAKESCOPE_POSTGRES_PASSWORD:?Set LAKESCOPE_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lakescope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    build:
      context: .
      dockerfile: containers/neo4j.Containerfile
    image: localhost/lakescope-neo4j:5.26-hardened
    container_name: lakescope-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${LAKESCOPE_NEO4J_PASSWORD:?Set LAKESCOPE_NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - lakescope_neo4j_data:/data
      - lakescope_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  lakescope_postgres_data:
  lakescope_neo4j_data:
  lakescope_neo4j_logs:
